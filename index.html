   errProdukt:"يرجى اختيار منتج واحد على الأقل.", errTel:"يرجى إدخال رقم هاتف صحيح.",
   errCode:"رمز التخفيض غير صالح.", choisir:"— اختر —",
   copyright:"© 2026 Valoris. جميع الحقوق محفوظة. معاينة محمية – يمنع النسخ.",
   waText:"مرحبًا، أريد طلب كتب Puls." },
};
const GOUV = ["Ariana","Béja","Ben Arous","Bizerte","Gabès","Gafsa","Jendouba","Kairouan","Kasserine","Kébili","Le Kef","Mahdia","La Manouba","Médenine","Monastir","Nabeul","Sfax","Sidi Bouzid","Siliana","Sousse","Tataouine","Tozeur","Tunis","Zaghouan"];
let L = "fr";
const menge = {}; PRODUKTE.forEach(p => menge[p.id] = 0);

function t(k){ return (T[L] && T[L][k]) || T.fr[k] || ""; }
function waLink(text){ return "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(text); }

function sprache(l){
  L = l; document.documentElement.lang = l; document.documentElement.dir = (l === "ar") ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  ["waHero","waFloat","waFooter"].forEach(id => document.getElementById(id).href = waLink(t("waText")));
  const g = document.getElementById("gouv"), alt = g.value;
  g.innerHTML = '<option value="">' + t("choisir") + '</option>' + GOUV.map(x => '<option>' + x + '</option>').join("");
  g.value = alt;
  zeigeProdukte(); rechne();
  try { localStorage.setItem("puls_lang", l); } catch(e) {}
}

function zeigeProdukte(){
  document.getElementById("produkte").innerHTML = PRODUKTE.map(p => `
    <div class="karte">
      <div class="bild">${p.bild ? `<img src="${p.bild}" alt="" draggable="false">` : `<span class="ico">${p.id === "audio" ? "💿" : "📘"}</span>`}</div>
      <div class="inhalt">
        <h3>${p.name[L] || p.name.fr}</h3>
        <div class="preis">${p.preis} ${WAEHRUNG}</div>
        <div class="text">${p.text[L] || p.text.fr}</div>
        ${p.vorschau ? `<button class="link" onclick="leserAuf('${p.vorschau}')">📖 ${t("apercu")}</button>` : ""}
        <div class="menge"><span>${t("qte")}</span>
          <button type="button" onclick="aendere('${p.id}',-1)">−</button>
          <input type="number" min="0" value="${menge[p.id]}" onchange="setze('${p.id}',this.value)">
          <button type="button" onclick="aendere('${p.id}',1)">+</button>
        </div>
      </div>
    </div>`).join("");
}
function aendere(id, d){ menge[id] = Math.max(0, (menge[id] || 0) + d); zeigeProdukte(); rechne(); }
function setze(id, v){ menge[id] = Math.max(0, parseInt(v) || 0); rechne(); }

function rabattProzent(){
  const c = document.getElementById("code").value.trim().toUpperCase();
  return c && RABATTCODES[c] !== undefined ? RABATTCODES[c] : 0;
}
function rechne(){
  let summe = 0, zeilen = "";
  PRODUKTE.forEach(p => { const m = menge[p.id]; if (m > 0) { const b = m * p.preis; summe += b;
    zeilen += `<tr><td>${m} × ${p.name[L] || p.name.fr}</td><td>${b.toFixed(2)} ${WAEHRUNG}</td></tr>`; } });
  const r = rabattProzent(), abzug = summe * r / 100;
  if (r) zeilen += `<tr><td>${t("rabatt")} (${r} %)</td><td>− ${abzug.toFixed(2)} ${WAEHRUNG}</td></tr>`;
  const lief = summe > 0 ? LIEFERUNG : 0;
  if (lief) zeilen += `<tr><td>${t("liefer")}</td><td>${lief.toFixed(2)} ${WAEHRUNG}</td></tr>`;
  const total = summe - abzug + lief;
  document.getElementById("korb").innerHTML = zeilen || `<tr><td>${t("korbLeer")}</td><td></td></tr>`;
  document.getElementById("summe").textContent = `${t("total")} : ${total.toFixed(2)} ${WAEHRUNG}`;
  return { summe, r, abzug, lief, total };
}

document.getElementById("code").addEventListener("input", rechne);
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const f = new FormData(e.target), err = document.getElementById("fehler"); err.textContent = "";
  const k = rechne();
  if (k.summe <= 0) { err.textContent = t("errProdukt"); return; }
  const tel = (f.get("tel") || "").replace(/[^\d+]/g, "");
  if (tel.replace(/\D/g, "").length < 8) { err.textContent = t("errTel"); return; }
  const code = (f.get("code") || "").trim().toUpperCase();
  if (code && !k.r) { err.textContent = t("errCode"); return; }
  const nr = "R" + new Date().toISOString().slice(2,10).replace(/-/g,"") + "-" + Math.floor(1000 + Math.random()*9000);
  let msg = `*Commande Puls ${nr}*\n\n`;
  PRODUKTE.forEach(p => { if (menge[p.id] > 0) msg += `• ${menge[p.id]} × ${p.name.fr} (${p.preis} ${WAEHRUNG})\n`; });
  if (k.r) msg += `• Code ${code}: −${k.r} %\n`;
  if (k.lief) msg += `• Livraison : ${k.lief} ${WAEHRUNG}\n`;
  msg += `*Total : ${k.total.toFixed(2)} ${WAEHRUNG}*\n\n`;
  msg += `Nom : ${f.get("vorname")} ${f.get("nachname")}\n`;
  if (f.get("firma")) msg += `École/Entreprise : ${f.get("firma")}\n`;
  msg += `Téléphone : ${f.get("tel")}\nAdresse : ${f.get("strasse")}, ${f.get("plz")} ${f.get("ort")}, ${f.get("gouv")}\n`;
  if (f.get("notiz")) msg += `Remarque : ${f.get("notiz")}\n`;
  msg += `Langue : ${L.toUpperCase()}\nSource : ${new URLSearchParams(location.search).get("src") || "site"}`;
  if (GOOGLE_TABELLE) {
    const m = {}; PRODUKTE.forEach(p => m[p.id] = menge[p.id]);
    const daten = { nr, vorname: f.get("vorname"), nachname: f.get("nachname"), firma: f.get("firma"),
      tel: f.get("tel"), strasse: f.get("strasse"), plz: f.get("plz"), ort: f.get("ort"), gouv: f.get("gouv"),
      mengen: m, code, rabatt: k.r, lieferung: k.lief, total: Number(k.total.toFixed(2)), notiz: f.get("notiz"),
      sprache: L, quelle: new URLSearchParams(location.search).get("src") || "site" };
    try { fetch(GOOGLE_TABELLE, { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(daten) }); } catch (x) {}
  }
  window.open(waLink(msg), "_blank");
  document.getElementById("ok").style.display = "block";
});

/* Vorschau-Leser: nur Bilder mit Wasserzeichen, kein Speichern/Drucken */
let leserBuch = "", leserSeite = 1; const MAX = 18;
function leserAuf(b){ leserBuch = b; leserSeite = 1; zeigeSeite(); document.getElementById("leser").style.display = "flex"; }
function leserZu(){ document.getElementById("leser").style.display = "none"; }
function blättern(d){ leserSeite = Math.min(MAX, Math.max(1, leserSeite + d)); zeigeSeite(); }
function zeigeSeite(){
  document.getElementById("leserBild").src = `preview/${leserBuch}_${String(leserSeite).padStart(2,"0")}.jpg`;
  document.getElementById("leserNr").textContent = `${leserSeite} / ${MAX}`;
}
document.addEventListener("keydown", e => {
  if (document.getElementById("leser").style.display === "flex") {
    if (e.key === "ArrowRight") blättern(L === "ar" ? -1 : 1);
    if (e.key === "ArrowLeft") blättern(L === "ar" ? 1 : -1);
    if (e.key === "Escape") leserZu();
  }
  if ((e.ctrlKey || e.metaKey) && ["s","p","u"].includes(e.key.toLowerCase())) e.preventDefault();
});
document.addEventListener("dragstart", e => { if (e.target.tagName === "IMG") e.preventDefault(); });

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => sprache(b.dataset.l));
let start = "fr"; try { start = localStorage.getItem("puls_lang") || "fr"; } catch(e) {}
sprache(start);
</script>
</body>
</html>
